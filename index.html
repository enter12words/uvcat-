<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<title>诗集</title>
<style>
:root{
  --bg:#f7f6f2;
  --paper:#f5f1e9;
  --paper-line:#e6e2d8;
  --surface:#ffffff;
  --ink:#202124;
  --muted:#6f706d;
  --line:#deddd7;
  --line-dark:#c8c7c1;
  --red:#ea4335;
  --yellow:#fbbc05;
  --green:#34a853;
  --shadow:0 16px 44px rgba(32,33,36,.09);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
}
*{box-sizing:border-box}
::selection{
  background:#A80030;
  color:#fff;
}
::-moz-selection{
  background:#A80030;
  color:#fff;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);background:var(--bg);min-height:100vh;
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
body.reader-open{overflow:hidden}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
}
button,input{font:inherit}
button{color:inherit}
header,main{position:relative;z-index:1}

/* ---------- header ---------- */
header{
  max-width:1180px;margin:0 auto;padding:23px 30px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:11px;font-size:11px;font-weight:700;letter-spacing:.19em}
.brand-mark{width:28px;height:8px;display:flex;gap:2px}
.brand-mark::before{content:"";display:block;width:8px;height:8px;border-radius:50%;
  background:var(--red);box-shadow:10px 0 0 var(--yellow),20px 0 0 var(--green)}
nav{display:flex;gap:22px;font-size:12px}
nav a{color:#5f6368;text-decoration:none}
nav a:hover{color:var(--ink)}

/* ---------- hero ---------- */
.hero{
  max-width:1180px;margin:0 auto;padding:64px 30px 46px;
}
.eyebrow{color:#73756f;font-size:10px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:16px}
h1{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(80px,12vw,150px);line-height:.8;margin:0;letter-spacing:-.07em;
}
.hero-sub{margin:26px 0 0;color:#5f6368;max-width:610px;line-height:2;font-size:14px;letter-spacing:.03em}

/* ---------- featured ---------- */
.featured{max-width:1180px;margin:0 auto;padding:0 30px}
.featured-card{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;
  min-height:330px;padding:40px 44px;display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--surface);box-shadow:var(--shadow);
}
.featured-card::before{
  content:"";position:absolute;right:50px;top:40px;width:230px;height:230px;border-radius:50%;
  border:1px solid rgba(234,67,53,.22);
  box-shadow:0 0 0 28px rgba(251,188,5,.07),0 0 0 58px rgba(52,168,83,.045);
}
.featured-card::after{
  content:"";position:absolute;right:-100px;bottom:75px;width:520px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(32,33,36,.16),transparent);transform:rotate(-18deg);
}
.featured-content{
  transition:opacity .28s ease, transform .28s ease;
}
.featured-content.switching{
  opacity:0;
  transform:translateY(6px);
}
.featured-kicker{color:#6f706d;font-size:10px;letter-spacing:.2em;margin-bottom:13px}
.featured-title{
  font-family:var(--serif);font-size:clamp(42px,6vw,68px);font-weight:500;margin:0;letter-spacing:-.04em;
}
.featured-quote{
  position:absolute;right:54px;top:53px;max-width:300px;color:#343633;text-align:right;
  font-family:var(--serif);font-size:18px;line-height:1.9;
  transition:opacity .28s ease;
}
.featured-quote.switching{opacity:0}
.featured-footer{
  margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:relative;z-index:2;
}
.featured-btn{
  display:inline-flex;width:max-content;padding:9px 16px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:12px;border:0;cursor:pointer;
  transition:background .18s ease;
}
.featured-btn:hover{background:#3a3b3d}
.featured-dots{
  display:flex;align-items:center;gap:8px;
}
.featured-dot{
  width:7px;height:7px;padding:0;border-radius:999px;border:0;
  background:var(--line-dark);cursor:pointer;
  transition:width .24s ease, background .24s ease;
}
.featured-dot:hover{background:#8e908b}
.featured-dot.active{width:22px;background:var(--ink)}

/* ---------- sections ---------- */
.section{max-width:1180px;margin:70px auto 0;padding:0 30px}
.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}
.section-title{font-family:var(--serif);font-size:30px;font-weight:500;margin:0}
.section-copy{color:#777873;font-size:12px;line-height:1.8;max-width:410px;text-align:right}

/* ---------- collection chips ---------- */
.collections{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:2px 2px 10px;
}
.collection{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:12px 22px;color:#63645f;cursor:pointer;
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease;
}
.collection:hover{border-color:var(--line-dark);color:var(--ink);transform:translateY(-1px)}
.collection.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.collection.active .collection-count{opacity:.7}
.collection-name{font-family:var(--serif);font-size:17px}
.collection-count{font-size:11px;opacity:.55}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin:22px 0 18px}
.search{flex:1;min-width:0}
.search input{
  width:100%;background:var(--surface);border:1px solid var(--line);outline:none;color:var(--ink);
  border-radius:10px;padding:11px 13px;font-size:12.5px;
}
.search input::placeholder{color:#9a9b97}
.search input:focus{border-color:#9d9e99;box-shadow:0 0 0 3px rgba(32,33,36,.05)}

/* ---------- poem cards ---------- */
.poems{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:20px}
.poem-card{
  appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:10px 11px 11px;text-align:left;cursor:pointer;color:inherit;
  display:flex;flex-direction:column;gap:7px;
  transition:background .15s ease,border-color .15s ease,transform .15s ease;
}
.poem-card:hover{background:#fbfbf9;border-color:var(--line-dark);transform:translateY(-1px)}
.poem-card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.poem-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.poem-title{font-family:var(--serif);font-size:14.5px;line-height:1.3}
.poem-collection{font-size:9px;color:#9a9b96;flex:0 0 auto}
.poem-excerpt{
  font-family:var(--serif);font-size:11px;line-height:1.7;color:#6c6d68;margin:0;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
  white-space:pre-wrap;
}
.empty{
  padding:55px 20px;text-align:center;color:#898a86;
  border:1px dashed var(--line);border-radius:15px;grid-column:1/-1;font-size:13px;
}

/* ---------- reading page ---------- */
.reading-page{
  position:fixed;inset:0;z-index:100;
  background:var(--paper);color:var(--ink);
  display:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.reading-page.show{display:block;animation:readerIn .22s ease}
@keyframes readerIn{from{opacity:0}to{opacity:1}}
.reading-top{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:flex-start;
  padding:15px max(30px,calc((100% - 720px)/2));
  background:rgba(245,241,233,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--paper-line);
}
.reading-back{
  border:1px solid #d9d4c7;background:transparent;border-radius:999px;
  padding:7px 16px;color:#656661;font-size:11.5px;letter-spacing:.06em;cursor:pointer;
  transition:color .16s ease,border-color .16s ease,background .16s ease;
}
.reading-back:hover{color:var(--ink);border-color:#bcb7a9;background:#fff}
.reading-shell{width:min(720px,100%);margin:0 auto;padding:58px 30px 110px}
.reader-collection{font-size:10px;letter-spacing:.18em;color:#8a8b87;margin-bottom:12px}
.reader-title{
  font-family:var(--serif);font-size:clamp(28px,5vw,40px);font-weight:500;
  margin:0 0 34px;letter-spacing:-.02em;line-height:1.25;
}
.reader-poem{
  font-family:var(--serif);font-size:18px;line-height:1.85;
  white-space:pre-wrap;letter-spacing:.02em;word-break:break-word;
}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .featured-quote{position:static;text-align:left;margin:0 0 24px}
  .featured-card{min-height:310px}
  .featured-card::before{right:-25px;top:-20px}
  .section-copy{text-align:left}
  .section-head{align-items:start;flex-direction:column}
}
@media (max-width:620px){
  header{padding:19px 18px}
  nav{display:none}
  .hero,.featured,.section{padding-left:18px;padding-right:18px}
  .hero{padding-top:44px}
  h1{font-size:78px}
  .hero-sub{font-size:13px}
  .featured-card{padding:28px;min-height:300px;border-radius:20px}
  .featured-quote{font-size:16px}
  .featured-footer{flex-wrap:wrap}
  .collection{padding:10px 18px}
  .collection-name{font-size:15px}
  .poems{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
  .poem-card{padding:9px 10px 10px}
  .poem-title{font-size:13.5px}
  .poem-excerpt{font-size:10.5px}
  .section{margin-top:54px}
  .reading-top{padding:12px 18px}
  .reading-shell{padding:40px 20px 90px}
  .reader-poem{font-size:16.5px;line-height:1.8}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="brand-mark"></span><span>诗集</span></div>
  <nav><a href="#collections">Collections</a><a href="#poems">Poems</a></nav>
</header>

<main>
  <section class="hero">
    <div>
      <div class="eyebrow">诗集</div>
      <h1>她</h1>
      <p class="hero-sub">Rain, spring, night, orange, ice, and light.</p>
    </div>
  </section>

  <section class="featured">
    <div class="featured-card" id="featuredCard">
      <div class="featured-quote" id="featuredQuote">“世界依旧透明。”</div>
      <div class="featured-content" id="featuredContent">
        <div class="featured-kicker">THE FEATURED BOOK</div>
        <h2 class="featured-title" id="featuredTitle">《她》</h2>
      </div>
      <div class="featured-footer">
        <button class="featured-btn" id="featuredBtn" type="button">查看篇目</button>
        <div class="featured-dots" id="featuredDots" aria-label="切换推荐诗集"></div>
      </div>
    </div>
  </section>

  <section class="section" id="collections">
    <div class="section-head">
      <div><div class="eyebrow">COLLECTIONS</div><h2 class="section-title">诗集</h2></div>
      <div class="section-copy">Select a collection to filter.</div>
    </div>
    <div class="collections" id="collectionGrid"></div>
  </section>

  <section class="section" id="poems">
    <div class="section-head">
      <div><div class="eyebrow">POEMS</div><h2 class="section-title" id="poemHeading">全部诗篇</h2></div>
      <div class="section-copy" id="resultInfo"></div>
    </div>
    <div class="toolbar">
      <div class="search">
        <input id="searchInput" placeholder="搜索诗名或诗句……" autocomplete="off" aria-label="搜索诗名或诗句">
      </div>
    </div>
    <div class="poems" id="poemGrid"></div>
  </section>
</main>

<div class="reading-page" id="readingPage" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="reading-top">
    <button class="reading-back" id="readerBack" type="button">Back</button>
  </div>
  <div class="reading-shell">
    <div class="reader-collection" id="readerCollection"></div>
    <h2 class="reader-title" id="readerTitle"></h2>
    <div class="reader-poem" id="readerPoem"></div>
  </div>
</div>

<script>
/* =====================================================================
   数据 —— 由 诗集.md 逐字整理
   "/标题" 为诗题，"——诗集名" 表示其上诸篇属于该诗集
   ===================================================================== */
const collections = [
  {
    name: "她", file: "她.md",
    quote: "“连绵的雨，长久的爱。”",
    poems: [
      { title: "纯化", text:
`我最害怕的
在深冷静寂的夏天的
一个潮湿的夜晚

空荡的外面有着
人类的寂寞的灯。

夜莺，
萤火虫，
自然，
夜幕下的树，

像电影一样，
像爱的话语一样短暂，

像今天的心混乱，
像不眠的此刻，

像中国的一切一切困境，

抛开这些，
我还是爱你，

抛开你的过往和未来的未来，
抛开你的一切实在的幻想的特征，
抛开夏天调过的酒，
下午和晚上没完没了的彩色。

我还是爱你，
无论在漫长混乱的梦里，
更为漫长和混乱的现实，
在整个世界为你停留的时候，
在你的面前。
在无人在意的诗里。

我在等着你的
救赎，
或是我先救赎这个时代。

我的信仰，
从来不被这个时代认可，
崇高而纯洁的信仰，
就像那天下午照在你身上温馨，美好，橙色的光。`},
      { title: "滑动", text:
`灼热，
冰块，
时间熔化了，
橙色的白。

纯净的月光，
就像
就像
橙子切面的
鲜红。

几十亿年，
活物早已见怪不怪
充盈的射线，
在一颗鲜红的心上滑动。
一整束色彩晒出的伤痕，
刻在木星上。

只需要点开，
整个宇宙为你选择的，
悲伤不已。
你的，
你的。
你说，
要有光。

你的一切如此特殊，
全世界都知道。
太阳深处，
你的体温。`},
      { title: "贴", text:
`我和你的距离如此遥远，
台风紧贴着。`},
      { title: "空心", text:
`一个秋天无比漫长，
叶，鲜艳的橙色。
太阳，带着九百束温柔善良的光。

她，眼中新鲜，炽热的情欲，
刺痛着多么现代，科学，理性的，
空心。

秋天的树，摇动着鲜红，沙沙的火焰，
她就站在粟的狗的尾巴中间，
神秘得像引力的笑，
一下子，水星，金星，木星无比失控。

她轻轻地吃掉。
娇小的她，
她眼里深远，
热闹的宇宙。
她如此平等地给了一切的人，
生命。`},
      { title: "灵气", text:
`我和你的距离如此之远，
从星云和尘埃的一次呼吸，
到引力温暖寂静的拥抱。
从氧化的悲剧，
到软乎乎的狸花。

夏天橙色的暧昧的光，
像银白的冰水。
橙色的，暧昧的，
你的脸。

夜晚轻得不会下坠的风，
只是你的口红。
九州万千灵气构成了你的肤质，
你娇媚的眼神，温柔的泪水，
引得反粒子一度跑到此岸。`},
      { title: "夜晚", text:
`夜晚在流动。
台风呼出的湿气化作雨滴，在窗上，树上，在湍急的溪流里。
丝绸一样流动着。

夜幕，
像葡萄一样紫色的夜晚，像蓝莓一样黑色的同样也是夜晚。
雨水在夜里闪着水晶的光。
水洼看上去是银色的金属。
灯光像白色的油漆涂在地上。

透明的液滴在夏天的温柔中轻盈地飘，
旋转，
滴落到你小小的手心。
连绵的雨，
长久的爱。`},
      { title: "倾心", text:
`你的温柔与世俗不同，
整个世界为你倾心，

爱过你的人都知道，
风揉着你的肩，
雨拉着你，
流动的夜晚被你轻轻地抱着。

月光是难言的痛，
是融化的清冷。

每个人都爱你，
无一例外。

你的温柔带着一种色彩，
还没有人描述过。`},
      { title: "血", text:
`连续漫长的炎热，
迷幻长久地等待，
迷幻得像夜晚紫黑色的湖水，
玻璃陶瓷纯白如空气的声音，
灰尘的歌唱。

痛，疲倦与困惑，我的，
秋天的雨痛在冰冷麻木的心上，鲜红的热烈的。

在纯净无暇的湖，生生不息的流体，
像纯白的早晨，像漫天的雪一样白的水花。

迷幻的高温，
橙色的阳光漂白了大地，灰尘，
错乱的反射。
不无困惑地站在树上，
树上时飞时停。

从空气和暧昧的气氛，
一直错到了你柔软的漂亮的长发。
连绵的玻璃上的雾，秋雨。
爱，娇媚的雨滴融进秋天的湖。
太阳平淡地放射出九十亿道热烈的纯白的射线。
她平等地赐予每一个人，
生命。
不仅如此，温情。

湖面上跳动的沉痛的弦，
是世界唯一的解释。`}
    ]
  },
  {
    name: "心", file: "心.md",
    quote: "“你融化过冰河时代无边无际的白。”",
    poems: [
      { title: "心", text:
`痛苦和一切的痛苦，幸福之间，
对我来说没有差别。
我爱着你的深刻，决绝，
你不同于现实的高尚，
热烈，
无边无际，
就像春天的碎花，
一个下午就把世界染成她的，
橙色。

我需要的信仰，
长久没有感受过的激动，心跳，
都在你的怀里。

春天的下午，
雨水牵着你的手。

春天的，
温热。
松鼠爬上树梢，
花丛淡粉色，蓝色和白色。
麻雀，斑鸠悲伤地时飞时停，
啄食。
水洼对着明净又多彩的天空。

你融化过冰河时代无边无际的，
白。
我爱你的美和直接。
你最微小的优点，
脸的柔和动人，
随手写下的话。
无一例外，我都爱过。`},
      { title: "热", text:
`炽热的阳光
洒向
无处不在的灼热的冰块，`},
      { title: "雨", text:
`暴雨如注，
除了你以外，
一切潮湿又冷，
就像开水从地铁下坠，
直到下个站点，
玻璃幕墙和
人们最爱的
笑颜。

今天的雨，
天涯共此时，
水和月光，
不分彼此，
今天下雨了，
漂亮的雨，
似乎把一切都打乱。

一整个夏天的橙色和浸泡在，
你的温柔善良，
深色的阳光和无垠的夏天，
扑面而来。

世界因为一场又一场雨交织在一起。
你一下子就忘掉了。

每一点都是一句话，
闪光的，碎的，
是瞬息。

爱过你的人很多，
写下的爱，
就像玻璃上的雨水，
抹不掉。

雨水流到哪里，
都是跨越时代，

/* ================= 派生字段 ================= */
collections.forEach(c => {
  c.count = c.poems.length;
  c.poems.forEach(p => {
    p.lines = p.text.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    p.excerpt = p.lines.slice(0, 2).join("\n");
    p.collection = c.name;
    p.file = c.file;
  });
});
const allPoems = collections.flatMap(c => c.poems);
const totalPoems = allPoems.length;

/* ================= 元素 ================= */
const collectionGrid  = document.getElementById("collectionGrid");
const poemGrid        = document.getElementById("poemGrid");
const searchInput     = document.getElementById("searchInput");
const resultInfo      = document.getElementById("resultInfo");
const poemHeading     = document.getElementById("poemHeading");
const readingPage     = document.getElementById("readingPage");
const readerBack      = document.getElementById("readerBack");
const featuredCard    = document.getElementById("featuredCard");
const featuredContent = document.getElementById("featuredContent");
const featuredTitle   = document.getElementById("featuredTitle");
const featuredQuote   = document.getElementById("featuredQuote");
const featuredDots    = document.getElementById("featuredDots");

/* ================= 状态 ================= */
const ALL = "全部";
const DEFAULT_COLLECTION = "她";
let currentCollection = DEFAULT_COLLECTION;
let filtered = [];
let currentPoem = null;
let lastFocused = null;
let featuredIndex = 0;
let featuredTimer = null;

/* ================= 工具 ================= */
const escapeHtml = s => String(s).replace(/[&<>"']/g, m => (
  { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]
));

/* ================= Featured 轮播 ================= */
function renderFeaturedDots(){
  featuredDots.innerHTML = collections.map((c, i) => `
    <button class="featured-dot${i === featuredIndex ? " active" : ""}"
            type="button"
            data-idx="${i}"
            aria-label="《${escapeHtml(c.name)}》"></button>
  `).join("");
}

function setFeatured(idx, animate = true){
  featuredIndex = (idx + collections.length) % collections.length;
  const item = collections[featuredIndex];

  featuredDots.querySelectorAll(".featured-dot").forEach((dot, i) => {
    dot.classList.toggle("active", i === featuredIndex);
  });

  if (!animate){
    featuredTitle.textContent = `《${item.name}》`;
    featuredQuote.textContent = item.quote;
    return;
  }

  featuredContent.classList.add("switching");
  featuredQuote.classList.add("switching");
  setTimeout(() => {
    featuredTitle.textContent = `《${item.name}》`;
    featuredQuote.textContent = item.quote;
    featuredContent.classList.remove("switching");
    featuredQuote.classList.remove("switching");
  }, 190);
}

function startFeaturedLoop(){
  stopFeaturedLoop();
  featuredTimer = setInterval(() => {
    setFeatured(featuredIndex + 1, true);
  }, 4500);
}

function stopFeaturedLoop(){
  if (featuredTimer){
    clearInterval(featuredTimer);
    featuredTimer = null;
  }
}

featuredDots.addEventListener("click", e => {
  const dot = e.target.closest(".featured-dot");
  if (!dot) return;
  setFeatured(Number(dot.dataset.idx), true);
  startFeaturedLoop();
});

featuredCard.addEventListener("mouseenter", stopFeaturedLoop);
featuredCard.addEventListener("mouseleave", startFeaturedLoop);

/* ================= 渲染：诗集筛选 ================= */
function renderCollections(){
  const chips = [
    `<button class="collection" data-name="${ALL}" type="button">
       <span class="collection-name">全部</span>
       <span class="collection-count">${totalPoems}</span>
     </button>`,
    ...collections.map(c => `
      <button class="collection" data-name="${escapeHtml(c.name)}" type="button">
        <span class="collection-name">《${escapeHtml(c.name)}》</span>
        <span class="collection-count">${c.count}</span>
      </button>`)
  ];
  collectionGrid.innerHTML = chips.join("");
}

/* ================= 渲染：诗篇列表 ================= */
function renderPoems(){
  const q = searchInput.value.trim().toLowerCase();
  filtered = allPoems.filter(p => {
    const okCollection = currentCollection === ALL || p.collection === currentCollection;
    if (!okCollection) return false;
    if (!q) return true;
    return (p.title + " " + p.text + " " + p.collection).toLowerCase().includes(q);
  });

  resultInfo.textContent = `${filtered.length} 首${q ? " · 已筛选" : ""}`;

  if (!filtered.length){
    poemGrid.innerHTML = `<div class="empty">没有找到对应的诗篇。</div>`;
    return;
  }

  poemGrid.innerHTML = filtered.map((p, i) => `
    <button class="poem-card" type="button" data-index="${i}">
      <span class="poem-head">
        <span class="poem-title">${escapeHtml(p.title)}</span>
        <span class="poem-collection">《${escapeHtml(p.collection)}》</span>
      </span>
      <span class="poem-excerpt">${escapeHtml(p.excerpt)}</span>
    </button>`).join("");
}

/* ================= 选择诗集 ================= */
function selectCollection(name, opts = {}){
  currentCollection = name;

  collectionGrid.querySelectorAll(".collection").forEach(el => {
    el.classList.toggle("active", el.dataset.name === name);
  });

  poemHeading.textContent = name === ALL ? "全部诗篇" : `《${name}》`;
  renderPoems();

  if (opts.scroll){
    document.getElementById("poems").scrollIntoView({ behavior:"smooth", block:"start" });
  }
}

collectionGrid.addEventListener("click", e => {
  const btn = e.target.closest(".collection");
  if (!btn) return;
  selectCollection(btn.dataset.name, { scroll:true });
});

document.getElementById("featuredBtn").addEventListener("click", () => {
  const activeBook = collections[featuredIndex];
  selectCollection(activeBook ? activeBook.name : DEFAULT_COLLECTION, { scroll:true });
});

poemGrid.addEventListener("click", e => {
  const card = e.target.closest(".poem-card");
  if (!card) return;
  openReader(Number(card.dataset.index), card);
});

/* ================= 阅读页 ================= */
function openReader(index, sourceEl){
  const p = filtered[index];
  if (!p) return;

  currentPoem = index;
  lastFocused = sourceEl || lastFocused;

  document.getElementById("readerCollection").textContent = `《${p.collection}》`;
  document.getElementById("readerTitle").textContent = p.title;
  document.getElementById("readerPoem").textContent = p.text;

  readingPage.classList.add("show");
  readingPage.setAttribute("aria-hidden", "false");
  document.body.classList.add("reader-open");
  readingPage.scrollTop = 0;

  if (!readingPage.contains(document.activeElement)) {
    readerBack.focus({ preventScroll:true });
  }
}

function closeReader(){
  readingPage.classList.remove("show");
  readingPage.setAttribute("aria-hidden", "true");
  document.body.classList.remove("reader-open");
  currentPoem = null;
  if (lastFocused && document.contains(lastFocused)) {
    lastFocused.focus({ preventScroll:true });
  }
}

function changePoem(delta){
  if (filtered.length < 2) return;
  const next = (currentPoem + delta + filtered.length) % filtered.length;
  openReader(next, lastFocused);
}

readerBack.addEventListener("click", closeReader);

document.addEventListener("keydown", e => {
  if (!readingPage.classList.contains("show")) return;
  if (e.key === "Escape"){
    e.preventDefault();
    closeReader();
  } else if (e.key === "ArrowRight"){
    e.preventDefault();
    changePoem(1);
  } else if (e.key === "ArrowLeft"){
    e.preventDefault();
    changePoem(-1);
  }
});

let searchTimer = null;
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderPoems, 120);
});

/* ================= 初始化 ================= */
renderFeaturedDots();
setFeatured(0, false);
startFeaturedLoop();

renderCollections();
selectCollection(DEFAULT_COLLECTION);
</script>
